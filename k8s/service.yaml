apiVersion: v1
kind: Service
metadata:
  name: country-integration-svc
  namespace: ncba-integration
  labels:
    app: country-integration
spec:
  type: ClusterIP
  selector:
    app: country-integration
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: management
    port: 9090
    targetPort: 9090
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: Service
metadata:
  name: country-integration-lb
  namespace: ncba-integration
  labels:
    app: country-integration
spec:
  type: LoadBalancer
  selector:
    app: country-integration
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
