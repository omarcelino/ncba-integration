apiVersion: v1
kind: ServiceAccount
metadata:
  name: country-integration
  namespace: ncba-integration
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: country-integration
  namespace: ncba-integration
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: country-integration
  namespace: ncba-integration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: country-integration
subjects:
- kind: ServiceAccount
  name: country-integration
  namespace: ncba-integration
